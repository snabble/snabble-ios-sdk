# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  Test:
    # ArrangementView and ToolbarContent.axisBehavior require the iOS 27.1 SDK
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test
        run: xcodebuild -workspace .swiftpm/xcode/package.xcworkspace -scheme Snabble-Package -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=latest' test
